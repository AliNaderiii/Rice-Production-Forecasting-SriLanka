[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sri-lanka-rice-forecasting"
version = "1.0.0"
description = "Leakage-aware seasonal backtesting for Sri Lankan rice production forecasts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.4,<1"]

[project.scripts]
rice-forecast-backtest = "rice_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
